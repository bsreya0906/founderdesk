# Render blueprint for the Express API. Create via Dashboard -> New -> Blueprint.
services:
  - type: web
    name: founderdesk-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI        # MongoDB Atlas connection string (required in production)
        sync: false
      - key: API_KEY            # long random string, same value in Vercel and n8n
        sync: false
      - key: CORS_ORIGIN        # your Vercel URL, e.g. https://founderdesk.vercel.app
        sync: false
      - key: LLM_PROVIDER       # mock | anthropic | openai
        value: mock
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
